{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Sign in</h1>
  <form method="post" class="col-md-4">
    {% csrf_token %}
    {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Username</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Password</label>
      <input class="form-control" type="password" name="password" id="id_password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary">Sign in</button>
  </form>
  <p class="mt-3 small">First time here? <a href="{% url 'inventory:activate' %}">Activate your account</a> with your one-time code.</p>
{% endblock %}
